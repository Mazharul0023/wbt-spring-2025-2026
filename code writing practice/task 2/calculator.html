<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discount Calculator</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <h2>Discount Calculator</h2>
        <label>Original Price:</label>
        <input type="number" id="origPrice" placeholder="0"> 

        <label>Discount (%):</label>
        <input type="number" id="discountPct" placeholder="0"> 

        <label>Final Price (incl. 5% tax):</label>
        <input type="number" id="finalPrice" readonly> 
    </div>
    <script src="script2.js"></script> 
</body>
</html>
